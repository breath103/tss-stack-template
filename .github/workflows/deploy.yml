name: Deploy

on:
  push:
    branches:
      - main
      - "**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build & Lint & Test backend
            command: ./packages/backend/scripts/build-types.ts && ./packages/backend/scripts/lint.ts && ./packages/backend/scripts/knip.ts && cd packages/backend && npx tsx --test src/**/__tests__/**/*.test.ts
          - name: Build & Lint & Test frontend
            command: ./packages/backend/scripts/build-types.ts && ./packages/frontend/scripts/build-types.ts && ./packages/frontend/scripts/lint.ts && ./scripts/knip.ts && cd packages/frontend && ../../scripts/with-env.sh --env=test npx vitest run
          - name: Build & Lint e2e & scripts & repo-wide biome
            command: ./scripts/e2e_build_types.ts && ./scripts/e2e_lint.ts && ./scripts/build_types.ts && ./scripts/scripts_lint.ts && ./scripts/biome_lint.ts
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: ${{ matrix.command }}
      - name: Verify stack cleanup policies
        if: matrix.name == 'Build & Lint & Test backend'
        run: node --import tsx --test .github/scripts/backend-stack.test.mjs
      # Needs no AWS access, so PR CI catches a stale package-lock.deploy.json even where the deploy job is main-only.
      - name: Verify packaged dependencies
        if: matrix.name == 'Build & Lint & Test backend'
        run: ./packages/backend/scripts/pack-build.ts && ./packages/backend/scripts/pack-install.ts && ./packages/backend/scripts/pack-verify.ts

  deploy:
    needs: check
    # Only main gets an AWS stack — branch pushes run checks only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
        id: node

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - run: ./packages/backend/scripts/pack-build.ts
      - uses: actions/cache@v5
        id: deploy-deps
        with:
          path: packages/backend/dist/node_modules
          key: backend-deploy-deps-v2-${{ runner.os }}-x64-glibc-${{ steps.node.outputs.node-version }}-${{ hashFiles('packages/backend/package-lock.deploy.json', 'packages/backend/package.json', 'packages/backend/scripts/pack-*') }}
      - if: steps.deploy-deps.outputs.cache-hit != 'true' && steps.node.outputs.cache-hit == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
      - if: steps.deploy-deps.outputs.cache-hit != 'true'
        run: ./packages/backend/scripts/pack-install.ts
      - name: Verify packaged dependencies
        run: ./packages/backend/scripts/pack-verify.ts
      - name: Deploy backend
        env:
          # packages/backend/src/env.d.ts
          REQUIRED_FOO: "required-backend-value"
          OPTIONAL_FOO: "optional-backend-value"
          GOOGLE_CLIENT_ID: "495965151122-nqsuprf3r5e9r8soqa5p15ini6sijhe0.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "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"
          BETTER_AUTH_SECRET: "RHY2DJS7bHHqwc6/+gSYx5pfx+lwt+epje+7bxjIWuY="
          DEPLOY_NAME: ${{ github.ref_name }}
        run: ./packages/backend/scripts/deploy.ts --name="$DEPLOY_NAME" --skip-build

      - name: Smoke test deployed Lambda
        env:
          DEPLOY_NAME: ${{ github.ref_name }}
        run: node --import tsx .github/scripts/smoke-deployment.mjs

      - name: Deploy frontend
        env:
          # packages/frontend/src/env.d.ts
          SITE_URL: "https://www.tsss.cloud"
          REQUIRED_FOO: "frontend-value"
          # OPTIONAL_FOO: ""
          DEPLOY_NAME: ${{ github.ref_name }}
        run: ./packages/frontend/scripts/deploy.ts --name="$DEPLOY_NAME"
