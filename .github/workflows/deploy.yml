name: Deploy

on:
  push:
    branches:
      - main
      - "**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Typecheck and test run `ci_local.ts`, which is the step list for both groups, so a
  # step added there runs here with no second edit. Lint is sharded below.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: ./scripts/ci_local.ts --only typecheck

  lint:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # `--shard=k/n` splits the LINT_TREES table by measured cost inside the script, so this
    # matrix lists SHARD NUMBERS, never tree names: adding a tree lands it in a shard
    # automatically.
    name: Lint ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      # oxlint is type-aware and frontend source references backend types across the
      # package boundary; without the emitted declarations the `no-unsafe-*` family misfires.
      - run: ./packages/backend/scripts/build-types.ts
      - run: ./scripts/lint.ts --shard=${{ matrix.shard }}/2
      - if: matrix.shard == 1
        run: ./scripts/knip.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: ./scripts/ci_local.ts --only test
      # The stack test synthesizes the Lambda asset from `packages/backend/dist`.
      - run: ./packages/backend/scripts/build-types.ts
      - name: Verify stack cleanup policies
        run: node --import tsx --test .github/scripts/backend-stack.test.mjs
      # Needs no AWS access, so PR CI catches a stale package-lock.deploy.json even where the deploy job is main-only.
      - name: Verify packaged dependencies
        run: ./packages/backend/scripts/pack-build.ts && ./packages/backend/scripts/pack-install.ts && ./packages/backend/scripts/pack-verify.ts

  check:
    name: All checks
    needs: [typecheck, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check group to pass
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$TYPECHECK_RESULT" = success
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
        id: node

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - run: ./packages/backend/scripts/pack-build.ts
      - uses: actions/cache@v5
        id: deploy-deps
        with:
          path: packages/backend/dist/node_modules
          key: backend-deploy-deps-v2-${{ runner.os }}-x64-glibc-${{ steps.node.outputs.node-version }}-${{ hashFiles('packages/backend/package-lock.deploy.json', 'packages/backend/package.json', 'packages/backend/scripts/pack-*') }}
      - if: steps.deploy-deps.outputs.cache-hit != 'true' && steps.node.outputs.cache-hit == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
      - if: steps.deploy-deps.outputs.cache-hit != 'true'
        run: ./packages/backend/scripts/pack-install.ts
      - name: Verify packaged dependencies
        run: ./packages/backend/scripts/pack-verify.ts
      - name: Deploy backend
        env:
          # packages/backend/src/env.d.ts
          REQUIRED_FOO: "required-backend-value"
          OPTIONAL_FOO: "optional-backend-value"
          GOOGLE_CLIENT_ID: "495965151122-nqsuprf3r5e9r8soqa5p15ini6sijhe0.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "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"
          BETTER_AUTH_SECRET: "RHY2DJS7bHHqwc6/+gSYx5pfx+lwt+epje+7bxjIWuY="
          DEPLOY_NAME: ${{ github.ref_name }}
        run: ./packages/backend/scripts/deploy.ts --name="$DEPLOY_NAME" --skip-build

      - name: Smoke test deployed Lambda
        env:
          DEPLOY_NAME: ${{ github.ref_name }}
        run: node --import tsx .github/scripts/smoke-deployment.mjs

      - name: Deploy frontend
        env:
          # packages/frontend/src/env.d.ts
          SITE_URL: "https://www.tsss.cloud"
          REQUIRED_FOO: "frontend-value"
          # OPTIONAL_FOO: ""
          DEPLOY_NAME: ${{ github.ref_name }}
        run: ./packages/frontend/scripts/deploy.ts --name="$DEPLOY_NAME"
