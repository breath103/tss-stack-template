name: Cleanup

on: delete

concurrency:
  group: deploy-refs/heads/${{ github.event.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    # Only run when a branch is deleted (not tags)
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Destroy backend
        env:
          DEPLOY_NAME: ${{ github.event.ref }}
        run: ./packages/backend/scripts/destroy.ts --name="$DEPLOY_NAME" --skip-prompt

      - name: Destroy frontend
        env:
          DEPLOY_NAME: ${{ github.event.ref }}
        run: ./packages/frontend/scripts/destroy.ts --name="$DEPLOY_NAME" --skip-prompt
